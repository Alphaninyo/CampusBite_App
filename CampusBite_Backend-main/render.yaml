services:
  - type: web
    name: campusbite-backend-api
    runtime: node
    rootDir: CampusBite_Backend-main
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Database is Neon (external, not a Render-managed Postgres) — Render's
      # own free Postgres expires after 30 days. Neon's free tier does not.
      # Values are set manually via the Render dashboard, never committed here.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Secrets below are intentionally left unset here (sync: false) —
      # fill them in via the Render dashboard after the blueprint deploys.
      # Never commit real key values into this file.
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # Cloudinary — image storage. Render's own disk is ephemeral (wiped on
      # every restart/redeploy), so uploaded images can't live on local disk.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
